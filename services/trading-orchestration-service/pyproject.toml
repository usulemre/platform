# trading-orchestration-service — the deterministic trading-chain composition seam (Layer 4).
# Its ONLY job is to sequence the existing deterministic engines (portfolio -> risk -> parity ->
# execution) and thread each engine's immutable output into the next. It ORCHESTRATES, it never
# ADJUDICATES (WCON-2, DH-7): every decision stays with its own engine. See ADR-0001.
[project]
name = "trading-orchestration-service"
version = "0.1.0"
description = "Deterministic, auditable, fail-closed trading-chain orchestration (WCON-1/2)."
requires-python = ">=3.12"
dependencies = [
  "core-domain",
  "portfolio-service",
  "risk-service",
  "execution-service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_orchestration_service"]
